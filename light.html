<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADSHARE · 廣告分潤智控台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f8; --bg2:#f6f8fc;
  --panel:#ffffff; --panel-2:#fbfcff;
  --stroke:#e5e9f2; --stroke-2:#d3d9e8;
  --cobalt:#3b5bff; --cobalt-2:#5b76ff; --cobalt-ink:#1a2a80;
  --coral:#ff5a36; --coral-2:#ff7a52;
  --amber:#f59e0b; --teal:#12b886; --violet:#7c5cff; --rose:#f43f5e;
  --ink:#141a33; --ink-2:#5a6382; --ink-3:#98a0bb;
  --radius:18px; --radius-sm:12px;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --sh:0 1px 2px rgba(20,26,51,.05),0 8px 24px -12px rgba(59,91,255,.16);
  --sh-lg:0 2px 6px rgba(20,26,51,.06),0 20px 44px -18px rgba(59,91,255,.24);
}
*{box-sizing:border-box;margin:0;padding:0}
*{scrollbar-width:thin;scrollbar-color:#c3cbe0 transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c3cbe0;border-radius:9px;border:2.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--cobalt);background-clip:content-box}
html{scroll-behavior:smooth}html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--cobalt);text-decoration:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.grad{background:linear-gradient(100deg,var(--cobalt),var(--violet) 55%,var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}

#aurora{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}

/* ============ LOGIN ============ */
#login{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.lcard{position:relative;z-index:2;width:960px;max-width:96vw;height:600px;max-height:92vh;display:flex;border-radius:28px;overflow:hidden;box-shadow:var(--sh-lg);background:#fff;animation:rise .7s cubic-bezier(.2,.85,.25,1)}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
.lcard .left{flex:1.12;position:relative;padding:52px 50px;color:#fff;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(145deg,#2540e6 0%,var(--cobalt) 42%,var(--coral) 122%)}
#loginCanvas{position:absolute;inset:0;opacity:.55}
.lcard .left>*{position:relative;z-index:2}
.lcard .brand{display:flex;align-items:center;gap:13px;margin-bottom:40px}
.lcard .logo{width:48px;height:48px}
.lcard .bt{font-size:11px;letter-spacing:5px;opacity:.85}
.lcard .bt b{display:block;font-size:23px;letter-spacing:7px;font-weight:800;margin-top:2px}
.lcard h1{font-size:44px;line-height:1.16;font-weight:800;letter-spacing:-1.2px;margin-bottom:18px;text-wrap:balance}
.lcard .tag{font-size:15px;max-width:380px;line-height:1.75;opacity:.94}
.lstats{display:flex;gap:30px;margin-top:36px}
.lstats .n{font-size:26px;font-weight:800;letter-spacing:-1px}
.lstats .l{font-size:11px;opacity:.8;letter-spacing:1px;margin-top:5px}
.lchip{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);padding:7px 14px;border-radius:30px;font-size:12px}
.lcard .right{width:380px;padding:56px 46px;display:flex;flex-direction:column;justify-content:center}
.lcard .right h2{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.lcard .right .sub{color:var(--ink-3);font-size:13px;margin-bottom:26px}
.rtabs{display:flex;gap:6px;background:var(--bg);padding:5px;border-radius:14px;margin-bottom:24px}
.rtabs button{flex:1;height:38px;border-radius:10px;font-size:13px;color:var(--ink-2);font-weight:600;transition:.25s}
.rtabs button.on{background:#fff;color:var(--cobalt);box-shadow:var(--sh);font-weight:700}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:7px;font-weight:600;letter-spacing:.3px}
.inp{display:flex;align-items:center;height:46px;background:var(--bg2);border:1.5px solid var(--stroke);border-radius:13px;padding:0 14px;gap:10px;transition:.22s}
.inp:focus-within{border-color:var(--cobalt);background:#fff;box-shadow:0 0 0 4px rgba(59,91,255,.1)}
.inp svg{color:var(--ink-3);flex-shrink:0}
.inp input{flex:1;border:none;outline:none;background:none;color:var(--ink);font-size:14px;font-family:var(--mono)}
.lrow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-2);margin:4px 0 22px}
.btn-glow{width:100%;height:48px;border-radius:14px;font-size:15px;font-weight:800;color:#fff;position:relative;overflow:hidden;letter-spacing:2px;background:linear-gradient(120deg,var(--cobalt),var(--coral));box-shadow:0 12px 30px -10px rgba(255,90,54,.5);transition:.25s}
.btn-glow:hover{transform:translateY(-2px);box-shadow:0 18px 40px -10px rgba(255,90,54,.6)}
.btn-glow::after{content:"";position:absolute;top:0;left:-60%;width:38%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sheen 4s infinite}
@keyframes sheen{0%,55%{left:-60%}100%{left:135%}}
.lfoot{margin-top:22px;font-size:11px;color:var(--ink-3);text-align:center;line-height:1.9}

/* ============ APP ============ */
#app{display:none;position:relative;z-index:2;min-height:100vh}
.sider{position:fixed;left:0;top:0;bottom:0;width:250px;padding:22px 15px;z-index:20;display:flex;flex-direction:column;background:var(--panel-2);border-right:1px solid var(--stroke)}
.sbrand{display:flex;align-items:center;gap:12px;padding:4px 10px 24px}
.sbrand .logo{width:36px;height:36px}
.sbrand b{font-size:18px;font-weight:800;letter-spacing:2px;color:var(--ink)}
.sbrand small{display:block;font-size:9px;letter-spacing:2px;color:var(--ink-3)}
.menu{flex:1;overflow-y:auto;margin-top:2px}
.grp{font-size:10px;letter-spacing:2px;color:var(--ink-3);padding:16px 12px 8px;text-transform:uppercase;font-weight:700}
.mi{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:14px;color:var(--ink-2);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:4px;position:relative;transition:.24s cubic-bezier(.2,.8,.2,1)}
.mi svg{width:19px;height:19px;flex-shrink:0}
.mi:hover{color:var(--cobalt);background:rgba(59,91,255,.07)}
.mi.on{color:#fff;background:linear-gradient(120deg,var(--cobalt),var(--cobalt-2));box-shadow:0 12px 26px -10px rgba(59,91,255,.6)}
.mi .badge{margin-left:auto;background:var(--coral);color:#fff;font-size:10px;border-radius:10px;padding:1px 7px;font-family:var(--mono);font-weight:700}
.mi.on .badge{background:#fff;color:var(--coral)}
.sside{margin:12px 6px 2px;padding:16px;border-radius:16px;background:linear-gradient(140deg,rgba(59,91,255,.1),rgba(255,90,54,.08));font-size:12px;color:var(--ink-2)}
.sside b{color:var(--ink);display:block;margin-bottom:4px;font-size:12.5px}
.side-live{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11px;color:var(--teal);font-weight:600}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,184,134,.5)}70%{box-shadow:0 0 0 8px rgba(18,184,134,0)}100%{box-shadow:0 0 0 0 rgba(18,184,134,0)}}

.main{margin-left:250px;min-height:100vh;display:flex;flex-direction:column}
.header{height:68px;display:flex;align-items:center;padding:0 28px;gap:14px;position:sticky;top:0;z-index:15;background:rgba(246,248,252,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--stroke)}
.crumb{font-size:13px;color:var(--ink-3);letter-spacing:.3px}.crumb b{color:var(--ink);font-weight:700}
.hsp{flex:1}
.seg{display:flex;background:#fff;border:1px solid var(--stroke);border-radius:12px;padding:3px;box-shadow:var(--sh)}
.seg button{padding:6px 14px;font-size:12.5px;border-radius:9px;color:var(--ink-2);font-weight:600;transition:.22s}
.seg button.on{background:linear-gradient(120deg,var(--cobalt),var(--cobalt-2));color:#fff;box-shadow:0 6px 14px -6px rgba(59,91,255,.6)}
.hicon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);border:1px solid var(--stroke);background:#fff;position:relative;transition:.22s;box-shadow:var(--sh)}
.hicon:hover{color:var(--cobalt);border-color:var(--cobalt)}
.hicon .rd{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px #fff}
.who{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 6px;border-radius:14px;cursor:pointer;border:1px solid var(--stroke);background:#fff;transition:.22s;box-shadow:var(--sh)}
.who:hover{border-color:var(--cobalt)}
.who .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--cobalt),var(--coral));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.who .wn{font-size:13px;line-height:1.25;font-weight:600}.who .wn small{display:block;color:var(--ink-3);font-size:11px;font-weight:400}

.content{padding:28px;flex:1}
.content.swap{animation:swap .5s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pagehd{margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}
.pagehd h1{font-size:28px;font-weight:800;letter-spacing:-1px}
.pagehd p{color:var(--ink-3);font-size:13px;margin-top:5px}
.iso{display:inline-flex;align-items:center;gap:7px;background:rgba(59,91,255,.08);color:var(--cobalt);border:1px solid rgba(59,91,255,.2);border-radius:24px;padding:6px 15px;font-size:12px;font-weight:600;margin-top:13px}

.ticker{display:flex;align-items:center;gap:16px;height:48px;margin-bottom:22px;border-radius:14px;background:#fff;border:1px solid var(--stroke);box-shadow:var(--sh);overflow:hidden;padding-left:18px}
.ticker .tk-l{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--coral);letter-spacing:1px;white-space:nowrap;font-weight:800}
.ticker .tk-track{flex:1;overflow:hidden;position:relative;height:100%}
.tk-row{position:absolute;display:flex;gap:36px;align-items:center;height:100%;white-space:nowrap;animation:marq 26s linear infinite;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.tk-row b{color:var(--teal)}.tk-row i{color:var(--cobalt);font-style:normal}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.grid{display:grid;gap:20px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.6fr 1fr}
.panel{position:relative;border-radius:var(--radius);border:1px solid var(--stroke);background:var(--panel);box-shadow:var(--sh);overflow:hidden;transition:.35s cubic-bezier(.2,.8,.2,1)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--stroke)}
.ph h3{font-size:15px;font-weight:800;letter-spacing:-.2px}
.ph .more{font-size:12px;color:var(--ink-3);cursor:pointer;font-weight:600;transition:.2s}.ph .more:hover{color:var(--cobalt)}
.pb{padding:24px}

.stat{padding:24px}
.stat:hover{transform:translateY(-4px);box-shadow:var(--sh-lg)}
.stat .st-top{display:flex;justify-content:space-between;align-items:flex-start}
.stat .lbl{font-size:11px;color:var(--ink-3);letter-spacing:1px;text-transform:uppercase;font-weight:700}
.stat .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px}
.stat .val{font-size:32px;font-weight:800;margin:16px 0 4px;letter-spacing:-1.5px;font-family:var(--mono)}
.stat .val small{font-size:14px;color:var(--ink-3);margin-right:4px;font-family:var(--sans);font-weight:600}
.stat .dt{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--stroke)}
.stat .spark{margin-top:8px}
.up{color:var(--teal);font-weight:800}.down{color:var(--rose);font-weight:800}

.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.8px;text-transform:uppercase;padding:14px 20px;border-bottom:1px solid var(--stroke);white-space:nowrap;background:var(--panel-2)}
td{padding:15px 20px;border-bottom:1px solid var(--stroke);font-size:13.5px;color:var(--ink-2)}
tbody tr{transition:.2s}tbody tr:hover{background:var(--bg2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tval{color:var(--ink);font-weight:700}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 11px;border-radius:8px;line-height:1.5;font-weight:700}
.tag.g{color:#0d7a5a;background:rgba(18,184,134,.12)}
.tag.c{color:var(--cobalt-ink);background:rgba(59,91,255,.1)}
.tag.w{color:#b45309;background:rgba(245,158,11,.14)}
.tag.r{color:#be123c;background:rgba(244,63,94,.12)}
.tag.n{color:var(--ink-2);background:#eef1f8}
.dotm{width:6px;height:6px;border-radius:50%;background:currentColor}

.btn{height:38px;padding:0 17px;border-radius:12px;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.24s;border:1.5px solid transparent;font-weight:700}
.btn.pri{background:linear-gradient(120deg,var(--cobalt),var(--cobalt-2));color:#fff;box-shadow:0 10px 24px -10px rgba(59,91,255,.55)}
.btn.pri:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(59,91,255,.7)}
.btn.gold{background:linear-gradient(120deg,var(--coral),var(--coral-2));color:#fff;box-shadow:0 10px 24px -10px rgba(255,90,54,.55)}
.btn.gho{border-color:var(--stroke-2);color:var(--ink);background:#fff}.btn.gho:hover{border-color:var(--cobalt);color:var(--cobalt)}
.btn.txt{color:var(--cobalt);padding:0 10px}.btn.txt:hover{background:rgba(59,91,255,.08)}
.btn.sm{height:33px;font-size:12.5px;padding:0 13px}
.toolbar{display:flex;gap:11px;flex-wrap:wrap;align-items:center}
.sel{height:38px;border:1.5px solid var(--stroke);border-radius:12px;padding:0 34px 0 14px;font-size:13px;color:var(--ink);font-weight:600;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10'><path d='M1 3l4 4 4-4' stroke='%2398a0bb' fill='none' stroke-width='1.5'/></svg>") no-repeat right 13px center;-webkit-appearance:none;appearance:none;cursor:pointer;transition:.2s}
.sel:hover{border-color:var(--stroke-2)}

.progress{height:8px;background:#e9edf6;border-radius:6px;overflow:hidden;min-width:100px}
.progress i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cobalt),var(--coral));width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}

.sw{width:46px;height:26px;border-radius:26px;background:#d7dceb;position:relative;transition:.28s;flex-shrink:0;cursor:pointer}
.sw.on{background:linear-gradient(120deg,var(--cobalt),var(--cobalt-2))}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.28s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on::after{left:23px}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:18px 4px;border-bottom:1px solid var(--stroke)}
.setrow:last-child{border-bottom:none}
.setrow .sl{font-size:14px;color:var(--ink);font-weight:600}.setrow .sl small{display:block;color:var(--ink-3);font-size:12px;margin-top:3px;font-weight:400}

.legend{display:flex;gap:18px;font-size:12px;color:var(--ink-3);align-items:center}
.legend span{display:flex;align-items:center;gap:7px;font-weight:600}.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

.upzone{border:2px dashed var(--stroke-2);border-radius:16px;padding:40px;text-align:center;background:var(--bg2);transition:.3s;cursor:pointer}
.upzone:hover{border-color:var(--cobalt);background:rgba(59,91,255,.05)}
.upzone .ui{width:56px;height:56px;color:var(--cobalt);margin:0 auto 14px}
.upzone h4{font-size:15px;margin-bottom:6px;color:var(--ink);font-weight:700}.upzone p{font-size:12.5px;color:var(--ink-3)}

.hist{list-style:none}
.hist li{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--stroke)}
.hist li:last-child{border-bottom:none}
.hist .hd{width:10px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:5px}
.hist .hd .c{width:11px;height:11px;border-radius:50%;background:var(--cobalt);box-shadow:0 0 0 4px rgba(59,91,255,.15)}
.hist .hd .ln{flex:1;width:2px;background:var(--stroke-2);margin-top:5px}
.hist .ht{font-size:14px;color:var(--ink);font-weight:700}.hist .hm{font-size:12px;color:var(--ink-3);margin-top:3px}

.chk{width:20px;height:20px;border:1.5px solid var(--stroke-2);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;transition:.2s;font-size:12px}
.chk.on{background:linear-gradient(120deg,var(--cobalt),var(--cobalt-2));border-color:var(--cobalt);color:#fff}

.callout{background:rgba(255,90,54,.06);border:1px solid rgba(255,90,54,.2);border-left:4px solid var(--coral);border-radius:14px;padding:15px 20px;font-size:13px;color:var(--ink-2);display:flex;gap:12px;margin-bottom:22px}
.callout svg{color:var(--coral);flex-shrink:0;margin-top:1px}

#toast{position:fixed;top:26px;left:50%;transform:translateX(-50%) translateY(-24px);z-index:200;padding:13px 22px;border-radius:14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;opacity:0;transition:.35s cubic-bezier(.2,.8,.2,1);pointer-events:none;color:var(--ink);background:#fff;border:1px solid var(--stroke);box-shadow:var(--sh-lg)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#modal{position:fixed;inset:0;background:rgba(20,26,51,.32);backdrop-filter:blur(4px);z-index:150;display:none;align-items:center;justify-content:center}
#modal .box{width:560px;max-width:92vw;border-radius:22px;background:#fff;box-shadow:var(--sh-lg);overflow:hidden;animation:rise .4s cubic-bezier(.2,.8,.2,1)}
#modal .mh{display:flex;justify-content:space-between;align-items:center;padding:20px 26px;border-bottom:1px solid var(--stroke)}
#modal .mh h3{font-size:17px;font-weight:800}
#modal .mb{padding:26px;max-height:60vh;overflow-y:auto}
#modal .mf{padding:16px 26px;border-top:1px solid var(--stroke);display:flex;justify-content:flex-end;gap:12px}
.formg{margin-bottom:17px}.formg label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:8px;font-weight:600}
.formg input,.formg .selw{width:100%;height:44px;border:1.5px solid var(--stroke);border-radius:13px;padding:0 15px;font-size:14px;color:var(--ink);background:var(--bg2);outline:none;font-family:var(--mono)}
.formg input:focus{border-color:var(--cobalt);background:#fff;box-shadow:0 0 0 4px rgba(59,91,255,.1)}
.mini-note{font-size:12px;color:#b45309;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.28);border-radius:12px;padding:12px 15px;margin-top:6px}

/* ===== 2026 hover & scroll states ===== */
#scrollbar{position:fixed;top:0;left:0;height:3px;z-index:120;width:0;background:linear-gradient(90deg,var(--cobalt),var(--violet),var(--coral));box-shadow:0 0 10px rgba(59,91,255,.5);transition:width .1s linear}
.reveal{opacity:0;transform:translateY(22px)}
.reveal.in{opacity:1;transform:none;transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1)}
.panel:hover{border-color:rgba(59,91,255,.32);box-shadow:var(--sh-lg)}
.stat{will-change:transform;transform-style:preserve-3d}
.stat::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(59,91,255,.14),transparent 62%)}
.stat:hover::after{opacity:1}
.stat .ic{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.stat:hover .ic{transform:translateZ(30px) scale(1.08) rotate(-6deg)}
.stat .val,.stat .lbl{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.stat:hover .val{transform:translateZ(24px)}.stat:hover .lbl{transform:translateZ(14px)}
.mi svg{transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.mi:hover svg{transform:scale(1.15) rotate(-4deg)}
.btn:active{transform:translateY(0) scale(.97)!important}
tbody tr{position:relative}
tbody tr td:first-child{box-shadow:inset 3px 0 0 transparent;transition:box-shadow .2s}
tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--cobalt)}
.tag{transition:transform .2s}.tag:hover{transform:translateY(-1px)}
.upzone .ui{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.upzone:hover .ui{transform:translateY(-6px) scale(1.06)}
.hicon:hover,.who:hover,.seg button.on{transition:.24s cubic-bezier(.2,.8,.2,1)}
@media(hover:none){.stat:hover .ic,.stat:hover .val,.stat:hover .lbl{transform:none}}
@media(max-width:920px){
  .sider{width:72px;padding:16px 10px}.sbrand b,.sbrand small,.mi span,.grp,.sside{display:none}
  .mi{justify-content:center;padding:0}.sbrand{justify-content:center}

function lineChart(){
  const W=580,H=240,pad=42,max=1500;
  const x=i=>pad+i*(W-pad-12)/(trend.length-1),y=v=>H-26-(v/max)*(H-56);
  let rev='',shr='';trend.forEach((v,i)=>rev+=(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ');
  const sh=trend.map(v=>Math.round(v*0.7));sh.forEach((v,i)=>shr+=(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ');
  const area=rev+`L${x(11)} ${H-26} L${x(0)} ${H-26} Z`;
  let grid='';[0,375,750,1125,1500].forEach(g=>{const py=y(g);grid+=`<line x1="${pad}" y1="${py}" x2="${W-12}" y2="${py}" stroke="#eef1f8"/><text x="${pad-8}" y="${py+3}" text-anchor="end" font-size="10" fill="#98a0bb" font-family="'Inter','Noto Sans TC',sans-serif">${g}k</text>`;});
  let xl='';months.forEach((m,i)=>xl+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#98a0bb" font-family="'Inter','Noto Sans TC',sans-serif">${m}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b5bff" stop-opacity=".22"/><stop offset="1" stop-color="#3b5bff" stop-opacity="0"/></linearGradient></defs>
  ${grid}${xl}<path d="${area}" fill="url(#ga)" class="area"/><path d="${shr}" fill="none" stroke="#ff5a36" stroke-width="2.4" class="draw" stroke-linejoin="round"/><path d="${rev}" fill="none" stroke="#3b5bff" stroke-width="3" class="draw" stroke-linejoin="round"/><circle cx="${x(11)}" cy="${y(trend[11])}" r="5.5" fill="#3b5bff"/><circle cx="${x(11)}" cy="${y(trend[11])}" r="5.5" fill="none" stroke="#3b5bff" class="ping"/></svg>`;
}
function donut(){
  const total=sources.reduce((a,b)=>a+b.v,0);let acc=0;const R=64,r=42,cx=92,cy=96;let seg='';
  sources.forEach((s,idx)=>{const a0=acc/total*2*Math.PI-Math.PI/2;acc+=s.v;const a1=acc/total*2*Math.PI-Math.PI/2;const lg=(a1-a0)>Math.PI?1:0;
   const p=(ang,rad)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];const[x0,y0]=p(a0,R),[x1,y1]=p(a1,R),[xi1,yi1]=p(a1,r),[xi0,yi0]=p(a0,r);
   seg+=`<path d="M${x0} ${y0} A${R} ${R} 0 ${lg} 1 ${x1} ${y1} L${xi1} ${yi1} A${r} ${r} 0 ${lg} 0 ${xi0} ${yi0} Z" fill="${s.c}" class="don" style="--i:${idx};transform-origin:${cx}px ${cy}px"/>`;});
  let leg='';sources.forEach(s=>leg+=`<div style="display:flex;justify-content:space-between;padding:9px 0;font-size:13px;border-bottom:1px solid var(--stroke)"><span style="display:flex;align-items:center;gap:9px;color:var(--ink-2);font-weight:600"><i style="width:10px;height:10px;border-radius:3px;background:${s.c};display:inline-block"></i>${s.n}</span><b class="mono" style="color:var(--ink)">${(s.v/total*100).toFixed(0)}%</b></div>`);
  return `<div style="display:flex;gap:18px;align-items:center"><svg width="192" height="192" viewBox="0 0 192 192" style="flex-shrink:0">${seg}<text x="92" y="90" text-anchor="middle" font-size="11" fill="#98a0bb" font-family="'Inter','Noto Sans TC',sans-serif">NT$</text><text x="92" y="112" text-anchor="middle" font-size="20" font-weight="800" fill="#141a33" font-family="'Inter','Noto Sans TC',sans-serif">1.28M</text></svg><div style="flex:1">${leg}</div></div>`;
}

const RM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
let _io;
function animateIn(scope){
  runCounters(scope);
  // 2026 scroll-reveal: stagger panels into view
  const items=scope.querySelectorAll('.panel, .ticker');
  if(_io)_io.disconnect();
  if(RM){items.forEach(el=>el.classList.add('in'));}
  else{
    items.forEach(el=>el.classList.add('reveal'));
    _io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting){const el=e.target;const idx=[...items].indexOf(el);el.style.transitionDelay=Math.min(idx*60,360)+'ms';el.classList.add('in');_io.unobserve(el);}}),{threshold:.12,rootMargin:'0px 0px -40px 0px'});
    items.forEach(el=>_io.observe(el));
    requestAnimationFrame(()=>items.forEach(el=>{const r=el.getBoundingClientRect();if(r.top<innerHeight)el.classList.add('in');}));
  }
  // cursor spotlight + 3D tilt on stat cards
  scope.querySelectorAll('.stat').forEach(card=>{
    card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect();const px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
      card.style.setProperty('--mx',(px*100)+'%');card.style.setProperty('--my',(py*100)+'%');
      if(!RM)card.style.transform=`translateY(-4px) perspective(900px) rotateY(${(px-.5)*7}deg) rotateX(${(.5-py)*7}deg)`;});
    card.addEventListener('pointerleave',()=>{card.style.transform='';});
  });
  scope.querySelectorAll('path.draw').forEach(p=>{const len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=RM?0:len;p.getBoundingClientRect();p.style.transition='stroke-dashoffset 1.6s cubic-bezier(.3,.8,.3,1)';requestAnimationFrame(()=>p.style.strokeDashoffset=0);});
  scope.querySelectorAll('.area').forEach(a=>{a.style.opacity=0;a.style.transition='opacity 1.4s ease .3s';requestAnimationFrame(()=>a.style.opacity=1);});
  scope.querySelectorAll('.don').forEach(d=>{if(RM)return;d.style.opacity=0;d.style.transform='scale(.6)';d.style.transition=`all .6s cubic-bezier(.2,.8,.2,1) ${0.08*(+d.style.getPropertyValue('--i')||0)}s`;requestAnimationFrame(()=>{d.style.opacity=1;d.style.transform='scale(1)';});});
  scope.querySelectorAll('.progress i').forEach(i=>{const w=i.getAttribute('data-w');if(w)requestAnimationFrame(()=>i.style.width=w+'%');});
  const ep=scope.querySelector('.ping');if(ep&&!RM){ep.animate([{r:5.5,opacity:.8},{r:16,opacity:0}],{duration:1800,iterations:Infinity});}
}
function runCounters(scope){
  scope.querySelectorAll('[data-cu]').forEach(el=>{const target=+el.getAttribute('data-cu');const pre=el.getAttribute('data-pre')||'';if(RM){el.textContent=pre+nf(target);return;}
    const dur=1200,t0=performance.now();function step(now){let p=Math.min((now-t0)/dur,1);p=1-Math.pow(1-p,3);el.textContent=pre+nf(Math.round(target*p));if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);});
}

/* light mesh background */
(function(){const cv=document.getElementById('aurora'),ctx=cv.getContext('2d');let w,h;
 const blobs=[{x:.15,y:.1,r:.5,c:[59,91,255],a:.1,vx:.00006,vy:.00004},{x:.85,y:.2,r:.42,c:[255,90,54],a:.08,vx:-.00005,vy:.00006},{x:.6,y:.95,r:.5,c:[124,92,255],a:.07,vx:.00004,vy:-.00005}];
 function rs(){w=cv.width=innerWidth;h=cv.height=innerHeight;}window.addEventListener('resize',rs);rs();
 function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#eef1f8';ctx.fillRect(0,0,w,h);
   blobs.forEach(b=>{const cx=b.x*w,cy=b.y*h,rad=b.r*Math.max(w,h);const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,`rgba(${b.c[0]},${b.c[1]},${b.c[2]},${b.a})`);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);});}
 function loop(){blobs.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<.05||b.x>.95)b.vx*=-1;if(b.y<.05||b.y>.95)b.vy*=-1;});draw();if(!RM)requestAnimationFrame(loop);}
 draw();if(!RM)requestAnimationFrame(loop);
})();
/* login particle network (on colored block) */
(function(){const cv=document.getElementById('loginCanvas');if(!cv)return;const ctx=cv.getContext('2d');let w,h,ps=[];
 function rs(){w=cv.width=cv.offsetWidth;h=cv.height=cv.offsetHeight;ps=Array.from({length:Math.min(60,Math.floor(w*h/17000))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}));}
 window.addEventListener('resize',rs);rs();
 function draw(){ctx.clearRect(0,0,w,h);
   for(let i=0;i<ps.length;i++){const p=ps[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;
     ctx.beginPath();ctx.arc(p.x,p.y,1.7,0,7);ctx.fillStyle='rgba(255,255,255,.8)';ctx.fill();
     for(let j=i+1;j<ps.length;j++){const q=ps[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);if(d<115){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=`rgba(255,255,255,${.28*(1-d/115)})`;ctx.lineWidth=1;ctx.stroke();}}}
   if(!RM)requestAnimationFrame(draw);}
 draw();
})();
runCounters(document.getElementById('login'));
/* top scroll-progress bar */
(function(){const bar=document.getElementById('scrollbar');function upd(){const st=document.documentElement.scrollTop||document.body.scrollTop;const hgt=document.documentElement.scrollHeight-innerHeight;bar.style.width=(hgt>0?(st/hgt)*100:0)+'%';}window.addEventListener('scroll',upd,{passive:true});window.addEventListener('resize',upd);upd();})();
