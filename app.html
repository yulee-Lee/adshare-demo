<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURIX · 廣告分潤智控台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f8; --bg2:#f6f8fc;
  --panel:#ffffff; --panel-2:#fbfcff;
  --stroke:#e5e9f2; --stroke-2:#d3d9e8;
  --cobalt:#5b4be0; --cobalt-2:#7a5cff; --cobalt-ink:#2c1a80;
  --coral:#d9a441; --coral-2:#edc069;
  --amber:#f59e0b; --teal:#12b886; --violet:#7c5cff; --rose:#f43f5e;
  --ink:#141a33; --ink-2:#5a6382; --ink-3:#98a0bb;
  --radius:18px; --radius-sm:12px;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --sh:0 1px 2px rgba(20,26,51,.05),0 8px 24px -12px rgba(59,91,255,.16);
  --sh-lg:0 2px 6px rgba(20,26,51,.06),0 20px 44px -18px rgba(59,91,255,.24);
}
*{box-sizing:border-box;margin:0;padding:0}
*{scrollbar-width:thin;scrollbar-color:#c3cbe0 transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c3cbe0;border-radius:9px;border:2.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--cobalt);background-clip:content-box}
html{scroll-behavior:smooth}html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--cobalt);text-decoration:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.grad{background:linear-gradient(100deg,var(--cobalt),var(--violet) 55%,var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}

#aurora{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}

/* ============ LOGIN ============ */
#login{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.lcard{position:relative;z-index:2;width:960px;max-width:96vw;height:600px;max-height:92vh;display:flex;border-radius:28px;overflow:hidden;box-shadow:var(--sh-lg);background:#fff;animation:rise .7s cubic-bezier(.2,.85,.25,1)}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
.lcard .left{flex:1.12;position:relative;padding:52px 50px;color:#fff;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(145deg,#2540e6 0%,var(--cobalt) 42%,var(--coral) 122%)}
#loginCanvas{position:absolute;inset:0;opacity:.55}
.lcard .left>*{position:relative;z-index:2}
.lcard .brand{display:flex;align-items:center;gap:13px;margin-bottom:40px}
.lcard .logo{width:48px;height:48px}
.lcard .bt{font-size:11px;letter-spacing:5px;opacity:.85}
.lcard .bt b{display:block;font-size:23px;letter-spacing:7px;font-weight:800;margin-top:2px}
.lcard h1{font-size:44px;line-height:1.16;font-weight:800;letter-spacing:-1.2px;margin-bottom:18px;text-wrap:balance}
.lcard .tag{font-size:15px;max-width:380px;line-height:1.75;opacity:.94}
.lstats{display:flex;gap:30px;margin-top:36px}
.lstats .n{font-size:26px;font-weight:800;letter-spacing:-1px}
.lstats .l{font-size:11px;opacity:.8;letter-spacing:1px;margin-top:5px}
.lchip{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);padding:7px 14px;border-radius:30px;font-size:12px}
.lcard .right{width:380px;padding:56px 46px;display:flex;flex-direction:column;justify-content:center}
.lcard .right h2{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.lcard .right .sub{color:var(--ink-3);font-size:13px;margin-bottom:26px}
.rtabs{display:flex;gap:6px;background:var(--bg);padding:5px;border-radius:14px;margin-bottom:24px}
.rtabs button{flex:1;height:38px;border-radius:10px;font-size:13px;color:var(--ink-2);font-weight:600;transition:.25s}
.rtabs button.on{background:#fff;color:var(--cobalt);box-shadow:var(--sh);font-weight:700}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:7px;font-weight:600;letter-spacing:.3px}
.inp{display:flex;align-items:center;height:46px;background:var(--bg2);border:1.5px solid var(--stroke);border-radius:13px;padding:0 14px;gap:10px;transition:.22s}
.inp:focus-within{border-color:var(--cobalt);background:#fff;box-shadow:0 0 0 4px rgba(59,91,255,.1)}
.inp svg{color:var(--ink-3);flex-shrink:0}
.inp input{flex:1;border:none;outline:none;background:none;color:var(--ink);font-size:14px;font-family:var(--mono)}
.lrow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-2);margin:4px 0 22px}
.btn-glow{width:100%;height:48px;border-radius:14px;font-size:15px;font-weight:800;color:#fff;position:relative;overflow:hidden;letter-spacing:2px;background:linear-gradient(120deg,var(--cobalt),var(--coral));box-shadow:0 12px 30px -10px rgba(255,90,54,.5);transition:.25s}
.btn-glow:hover{transform:translateY(-2px);box-shadow:0 18px 40px -10px rgba(255,90,54,.6)}
.btn-glow::after{content:"";position:absolute;top:0;left:-60%;width:38%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sheen 4s infinite}
@keyframes sheen{0%,55%{left:-60%}100%{left:135%}}
.lfoot{margin-top:22px;font-size:11px;color:var(--ink-3);text-align:center;line-height:1.9}

/* ============ APP ============ */
#app{display:none;position:relative;z-index:2;min-height:100vh}
.sider{position:fixed;left:0;top:0;bottom:0;width:250px;padding:22px 15px;z-index:20;display:flex;flex-direction:column;background:var(--panel-2);border-right:1px solid var(--stroke)}
.sbrand{display:flex;align-items:center;gap:12px;padding:4px 10px 24px}
.sbrand .logo{width:36px;height:36px}
.sbrand b{font-size:18px;font-weight:800;letter-spacing:2px;color:var(--ink)}
.sbrand small{display:block;font-size:9px;letter-spacing:2px;color:var(--ink-3)}
.menu{flex:1;overflow-y:auto;margin-top:2px}
.grp{font-size:10px;letter-spacing:2px;color:var(--ink-3);padding:16px 12px 8px;text-transform:uppercase;font-weight:700}
.mi{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:14px;color:var(--ink-2);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:4px;position:relative;transition:.24s cubic-bezier(.2,.8,.2,1)}
.mi svg{width:19px;height:19px;flex-shrink:0}
.mi:hover{color:var(--cobalt);background:rgba(59,91,255,.07)}
.mi.on{color:#fff;background:linear-gradient(120deg,var(--cobalt),var(--cobalt-2));box-shadow:0 12px 26px -10px rgba(59,91,255,.6)}
.mi .badge{margin-left:auto;background:var(--coral);color:#fff;font-size:10px;border-radius:10px;padding:1px 7px;font-family:var(--mono);font-weight:700}
.mi.on .badge{background:#fff;color:var(--coral)}
.sside{margin:12px 6px 2px;padding:16px;border-radius:16px;background:linear-gradient(140deg,rgba(59,91,255,.1),rgba(255,90,54,.08));font-size:12px;color:var(--ink-2)}
.sside b{color:var(--ink);display:block;margin-bottom:4px;font-size:12.5px}
.side-live{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11px;color:var(--teal);font-weight:600}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,184,134,.5)}70%{box-shadow:0 0 0 8px rgba(18,184,134,0)}100%{box-shadow:0 0 0 0 rgba(18,184,134,0)}}

.main{margin-left:250px;min-height:100vh;display:flex;flex-direction:column}
.header{height:68px;display:flex;align-items:center;padding:0 28px;gap:14px;position:sticky;top:0;z-index:15;background:rgba(246,248,252,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--stroke)}
.crumb{font-size:13px;color:var(--ink-3);letter-spacing:.3px}.crumb b{color:var(--ink);font-weight:700}
.hsp{flex:1}
.seg{display:flex;background:#fff;border:1px solid var(--stroke);border-radius:12px;padding:3px;box-shadow:var(--sh)}
.seg button{padding:6px 14px;font-size:12.5px;border-radius:9px;color:var(--ink-2);font-weight:600;transition:.22s}
.seg button.on{background:linear-gradient(120deg,var(--cobalt),var(--cobalt-2));color:#fff;box-shadow:0 6px 14px -6px rgba(59,91,255,.6)}
.hicon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);border:1px solid var(--stroke);background:#fff;position:relative;transition:.22s;box-shadow:var(--sh)}
.hicon:hover{color:var(--cobalt);border-color:var(--cobalt)}
.hicon .rd{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px #fff}
.who{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 6px;border-radius:14px;cursor:pointer;border:1px solid var(--stroke);background:#fff;transition:.22s;box-shadow:var(--sh)}
.who:hover{border-color:var(--cobalt)}
.who .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--cobalt),var(--coral));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.who .wn{font-size:13px;line-height:1.25;font-weight:600}.who .wn small{display:block;color:var(--ink-3);font-size:11px;font-weight:400}

.content{padding:28px;flex:1}
.content.swap{animation:swap .5s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pagehd{margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}
.pagehd h1{font-size:28px;font-weight:800;letter-spacing:-1px}
.pagehd p{color:var(--ink-3);font-size:13px;margin-top:5px}
.iso{display:inline-flex;align-items:center;gap:7px;background:rgba(59,91,255,.08);color:var(--cobalt);border:1px solid rgba(59,91,255,.2);border-radius:24px;padding:6px 15px;font-size:12px;font-weight:600;margin-top:13px}

.ticker{display:flex;align-items:center;gap:16px;height:48px;margin-bottom:22px;border-radius:14px;background:#fff;border:1px solid var(--stroke);box-shadow:var(--sh);overflow:hidden;padding-left:18px}
.ticker .tk-l{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--coral);letter-spacing:1px;white-space:nowrap;font-weight:800}
.ticker .tk-track{flex:1;overflow:hidden;position:relative;height:100%}
.tk-row{position:absolute;display:flex;gap:36px;align-items:center;height:100%;white-space:nowrap;animation:marq 26s linear infinite;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.tk-row b{color:var(--teal)}.tk-row i{color:var(--cobalt);font-style:normal}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.grid{display:grid;gap:20px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.6fr 1fr}
.panel{position:relative;border-radius:var(--radius);border:1px solid var(--stroke);background:var(--panel);box-shadow:var(--sh);overflow:hidden;transition:.35s cubic-bezier(.2,.8,.2,1)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--stroke)}
.ph h3{font-size:15px;font-weight:800;letter-spacing:-.2px}
.ph .more{font-size:12px;color:var(--ink-3);cursor:pointer;font-weight:600;transition:.2s}.ph .more:hover{color:var(--cobalt)}
.pb{padding:24px}

.stat{padding:22px 24px;display:flex;flex-direction:column}
.stat:hover{transform:translateY(-4px);box-shadow:var(--sh-lg)}
.stat .st-top{display:flex;justify-content:space-between;align-items:center}
.stat .lbl{font-size:14px;color:var(--ink-2);font-weight:600;letter-spacing:0}
.stat .sinfo{color:var(--ink-3);display:flex;transition:color .2s;cursor:help}
.stat .sinfo:hover{color:var(--cobalt)}
.stat .val{font-size:31px;font-weight:800;margin:18px 0 0;letter-spacing:-1.5px;font-family:var(--mono);line-height:1.1}
.stat .val small{font-size:14px;color:var(--ink-3);margin-right:5px;font-family:var(--sans);font-weight:600}
.stat .mini{margin:14px 0 2px}.stat .mini svg{width:100%;height:auto}
.stat .dt{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:14px;border-top:1px solid var(--stroke)}
.stat .spark{margin-top:8px}
.up{color:var(--teal);font-weight:800}.down{color:var(--rose);font-weight:800}

.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.8px;text-transform:uppercase;padding:14px 20px;border-bottom:1px solid var(--stroke);white-space:nowrap;background:var(--panel-2)}
td{padding:15px 20px;border-bottom:1px solid var(--stroke);font-size:13.5px;color:var(--ink-2)}
tbody tr{transition:.2s}tbody tr:hover{background:var(--bg2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tval{color:var(--ink);font-weight:700}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 11px;border-radius:8px;line-height:1.5;font-weight:700}
.tag.g{color:#0d7a5a;background:rgba(18,184,134,.12)}
.tag.c{color:var(--cobalt-ink);background:rgba(59,91,255,.1)}
.tag.w{color:#b45309;background:rgba(245,158,11,.14)}
.tag.r{color:#be123c;background:rgba(244,63,94,.12)}
.tag.n{color:var(--ink-2);background:#eef1f8}
.dotm{width:6px;height:6px;border-radius:50%;background:currentColor}

.btn{height:38px;padding:0 17px;border-radius:12px;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.24s;border:1.5px solid transparent;font-weight:700}
.btn.pri{background:linear-gradient(120deg,var(--cobalt),var(--cobalt-2));color:#fff;box-shadow:0 10px 24px -10px rgba(59,91,255,.55)}
.btn.pri:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(59,91,255,.7)}
.btn.gold{background:linear-gradient(120deg,var(--coral),var(--coral-2));color:#fff;box-shadow:0 10px 24px -10px rgba(255,90,54,.55)}
.btn.gho{border-color:var(--stroke-2);color:var(--ink);background:#fff}.btn.gho:hover{border-color:var(--cobalt);color:var(--cobalt)}
.btn.txt{color:var(--cobalt);padding:0 10px}.btn.txt:hover{background:rgba(59,91,255,.08)}
.btn.sm{height:33px;font-size:12.5px;padding:0 13px}
.toolbar{display:flex;gap:11px;flex-wrap:wrap;align-items:center}
.sel{height:38px;border:1.5px solid var(--stroke);border-radius:12px;padding:0 34px 0 14px;font-size:13px;color:var(--ink);font-weight:600;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10'><path d='M1 3l4 4 4-4' stroke='%2398a0bb' fill='none' stroke-width='1.5'/></svg>") no-repeat right 13px center;-webkit-appearance:none;appearance:none;cursor:pointer;transition:.2s}
.sel:hover{border-color:var(--stroke-2)}

.progress{height:8px;background:#e9edf6;border-radius:6px;overflow:hidden;min-width:100px}
.progress i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cobalt),var(--coral));width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}

.sw{width:46px;height:26px;border-radius:26px;background:#d7dceb;position:relative;transition:.28s;flex-shrink:0;cursor:pointer}
.sw.on{background:linear-gradient(120deg,var(--cobalt),var(--cobalt-2))}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.28s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on::after{left:23px}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:18px 4px;border-bottom:1px solid var(--stroke)}
.setrow:last-child{border-bottom:none}
.setrow .sl{font-size:14px;color:var(--ink);font-weight:600}.setrow .sl small{display:block;color:var(--ink-3);font-size:12px;margin-top:3px;font-weight:400}

.legend{display:flex;gap:18px;font-size:12px;color:var(--ink-3);align-items:center}
.legend span{display:flex;align-items:center;gap:7px;font-weight:600}.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

.upzone{border:2px dashed var(--stroke-2);border-radius:16px;padding:40px;text-align:center;background:var(--bg2);transition:.3s;cursor:pointer}
.upzone:hover{border-color:var(--cobalt);background:rgba(59,91,255,.05)}
.upzone .ui{width:56px;height:56px;color:var(--cobalt);margin:0 auto 14px}
.upzone h4{font-size:15px;margin-bottom:6px;color:var(--ink);font-weight:700}.upzone p{font-size:12.5px;color:var(--ink-3)}

.hist{list-style:none}
.hist li{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--stroke)}
.hist li:last-child{border-bottom:none}
.hist .hd{width:10px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:5px}
.hist .hd .c{width:11px;height:11px;border-radius:50%;background:var(--cobalt);box-shadow:0 0 0 4px rgba(59,91,255,.15)}
.hist .hd .ln{flex:1;width:2px;background:var(--stroke-2);margin-top:5px}
.hist .ht{font-size:14px;color:var(--ink);font-weight:700}.hist .hm{font-size:12px;color:var(--ink-3);margin-top:3px}

.chk{width:20px;height:20px;border:1.5px solid var(--stroke-2);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;transition:.2s;font-size:12px}
.chk.on{background:linear-gradient(120deg,var(--cobalt),var(--cobalt-2));border-color:var(--cobalt);color:#fff}

.callout{background:rgba(255,90,54,.06);border:1px solid rgba(255,90,54,.2);border-left:4px solid var(--coral);border-radius:14px;padding:15px 20px;font-size:13px;color:var(--ink-2);display:flex;gap:12px;margin-bottom:22px}
.callout svg{color:var(--coral);flex-shrink:0;margin-top:1px}

#toast{position:fixed;top:26px;left:50%;transform:translateX(-50%) translateY(-24px);z-index:200;padding:13px 22px;border-radius:14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;opacity:0;transition:.35s cubic-bezier(.2,.8,.2,1);pointer-events:none;color:var(--ink);background:#fff;border:1px solid var(--stroke);box-shadow:var(--sh-lg)}
#gtip{position:fixed;z-index:300;pointer-events:none;background:rgba(15,21,36,.94);color:#fff;padding:7px 11px;border-radius:9px;font-size:12px;line-height:1.55;box-shadow:0 8px 22px rgba(0,0,0,.3);opacity:0;transition:opacity .1s;white-space:nowrap;transform:translate(-50%,-118%)}
#gtip b{color:#fff}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#modal{position:fixed;inset:0;background:rgba(20,26,51,.32);backdrop-filter:blur(4px);z-index:150;display:none;align-items:center;justify-content:center}
#modal .box{width:560px;max-width:92vw;border-radius:22px;background:#fff;box-shadow:var(--sh-lg);overflow:hidden;animation:rise .4s cubic-bezier(.2,.8,.2,1)}
#modal .mh{display:flex;justify-content:space-between;align-items:center;padding:20px 26px;border-bottom:1px solid var(--stroke)}
#modal .mh h3{font-size:17px;font-weight:800}
#modal .mb{padding:26px;max-height:60vh;overflow-y:auto}
#modal .mf{padding:16px 26px;border-top:1px solid var(--stroke);display:flex;justify-content:flex-end;gap:12px}
.formg{margin-bottom:17px}.formg label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:8px;font-weight:600}
.formg input,.formg .selw{width:100%;height:44px;border:1.5px solid var(--stroke);border-radius:13px;padding:0 15px;font-size:14px;color:var(--ink);background:var(--bg2);outline:none;font-family:var(--mono)}
.formg input:focus{border-color:var(--cobalt);background:#fff;box-shadow:0 0 0 4px rgba(59,91,255,.1)}
.mini-note{font-size:12px;color:#b45309;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.28);border-radius:12px;padding:12px 15px;margin-top:6px}

/* ===== 2026 hover & scroll states ===== */
#scrollbar{position:fixed;top:0;left:0;height:3px;z-index:120;width:0;background:linear-gradient(90deg,var(--cobalt),var(--violet),var(--coral));box-shadow:0 0 10px rgba(59,91,255,.5);transition:width .1s linear}
.reveal{opacity:0;transform:translateY(22px)}
.reveal.in{opacity:1;transform:none;transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1)}
.panel:hover{border-color:rgba(59,91,255,.32);box-shadow:var(--sh-lg)}
.stat{will-change:transform;transform-style:preserve-3d}
.stat::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(59,91,255,.14),transparent 62%)}
.stat:hover::after{opacity:1}
.stat .ic{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.stat:hover .ic{transform:translateZ(30px) scale(1.08) rotate(-6deg)}
.stat .val,.stat .lbl{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.stat:hover .val{transform:translateZ(24px)}.stat:hover .lbl{transform:translateZ(14px)}
.mi svg{transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.mi:hover svg{transform:scale(1.15) rotate(-4deg)}
.btn:active{transform:translateY(0) scale(.97)!important}
tbody tr{position:relative}
tbody tr td:first-child{box-shadow:inset 3px 0 0 transparent;transition:box-shadow .2s}
tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--cobalt)}
.tag{transition:transform .2s}.tag:hover{transform:translateY(-1px)}
.upzone .ui{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.upzone:hover .ui{transform:translateY(-6px) scale(1.06)}
.hicon:hover,.who:hover,.seg button.on{transition:.24s cubic-bezier(.2,.8,.2,1)}
@media(hover:none){.stat:hover .ic,.stat:hover .val,.stat:hover .lbl{transform:none}}
@media(max-width:920px){
  .sider{width:72px;padding:16px 10px}.sbrand b,.sbrand small,.mi span,.grp,.sside{display:none}
  .mi{justify-content:center;padding:0}.sbrand{justify-content:center}
  .main{margin-left:72px}.g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}
  .lcard{flex-direction:column;height:auto}.lcard .left{display:none}.lcard .right{width:100%}.crumb{display:none}
}
@media(max-width:640px){
  .content{padding:16px}
  .stat{padding:16px 18px}
  .stat .val{font-size:23px;letter-spacing:-.6px}
  .stat .val small{font-size:12px;margin-right:2px}
  .pagehd h1{font-size:22px}
  .grid{gap:14px}
  .hdr{padding:0 14px;gap:8px}#csel{max-width:130px}
  .phd{gap:8px}
}
@media(max-width:430px){ .g4{grid-template-columns:1fr} }
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}.tk-row{animation:none}}
</style>
</head>

function lineChart(){
  const n=trend.length;if(!n)return '<div style="padding:44px;text-align:center;color:var(--ink-3)">尚無資料</div>';
  const W=580,H=240,pad=42,max=Math.max(...trend,...trendShare,1);
  const x=i=>pad+i*(W-pad-12)/Math.max(n-1,1),y=v=>H-26-(v/max)*(H-56);
  const botY=H-26;
  let rev='';trend.forEach((v,i)=>rev+=(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ');
  let shr='';trendShare.forEach((v,i)=>shr+=(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ');
  const area=rev+`L${x(n-1)} ${botY} L${x(0)} ${botY} Z`;
  let segs='';for(let i=1;i<n;i++){const up=trend[i]>=trend[i-1];segs+=`<path d="M${x(i-1).toFixed(1)} ${y(trend[i-1]).toFixed(1)} L${x(i).toFixed(1)} ${y(trend[i]).toFixed(1)}" fill="none" stroke="${up?RED:GREEN}" stroke-width="2.8" stroke-linecap="round" filter="url(#neon)"/>`;}
  let grid='';[0,.25,.5,.75,1].forEach(f=>{const g=Math.round(max*f);const py=y(g);grid+=`<line x1="${pad}" y1="${py}" x2="${W-12}" y2="${py}" stroke="var(--stroke)"/><text x="${pad-8}" y="${py+3}" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="'Inter','Noto Sans TC',sans-serif">${g}k</text>`;});
  let xl='';months.forEach((m,i)=>{if(i%2===0||i===n-1)xl+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="'Inter','Noto Sans TC',sans-serif">${m}</text>`;});
  const lastUp=n>1?trend[n-1]>=trend[n-2]:true,lc=lastUp?RED:GREEN;
  const pts=trend.map((v,i)=>({sx:+x(i).toFixed(1),ry:+y(v).toFixed(1),period:(PERIODS[i]||months[i]||''),rev:v*1000,share:Math.round((trendShare[i]||0)*1000),up:i>0?trend[i]>=trend[i-1]:true}));
  return `<div class="tchart" style="position:relative">
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible;display:block"><defs><linearGradient id="revA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lc}" stop-opacity=".18"/><stop offset="1" stop-color="${lc}" stop-opacity="0"/></linearGradient><filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  ${grid}${xl}<path d="${area}" fill="url(#revA)" class="area"/><path d="${shr}" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 7" opacity=".85"/>${segs}<path d="${rev}" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="3" stroke-linecap="round" stroke-dasharray="20 5000" stroke-dashoffset="5020" filter="url(#neon)"><animate attributeName="stroke-dashoffset" from="5020" to="0" dur="2.8s" repeatCount="indefinite"/></path>
  <line class="tcross" x1="0" y1="6" x2="0" y2="${botY}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="4 4" style="opacity:0;pointer-events:none"/><circle class="tdot" r="5.5" fill="#fff" stroke="${lc}" stroke-width="3" style="opacity:0;pointer-events:none"/><circle cx="${x(n-1).toFixed(1)}" cy="${y(trend[n-1]).toFixed(1)}" r="5.5" fill="#fff" stroke="${lc}" stroke-width="3"/><circle cx="${x(n-1).toFixed(1)}" cy="${y(trend[n-1]).toFixed(1)}" r="5.5" fill="none" stroke="${lc}" class="ping"/></svg>
  <div class="ttip" style="position:absolute;top:4px;transform:translateX(-50%);background:rgba(15,21,36,.92);color:#fff;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.6;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 8px 22px rgba(0,0,0,.28);white-space:nowrap;z-index:6"></div>
  <div class="tover" data-w="${W}" data-pts='${JSON.stringify(pts)}' style="position:absolute;inset:0;cursor:crosshair"></div>
  </div>`;
}
function donut(){
  if(!sources.length)return '<div style="padding:44px;text-align:center;color:var(--ink-3)">尚無資料</div>';
  const total=sources.reduce((a,b)=>a+b.v,0)||1;let acc=0;const cx=120,cy=120,R=98,r=64,gap=0.05;let seg='',defs='';
  const totTxt=total>=1000?(total/1000).toFixed(2)+'M':nf(total)+'k';
  const shade=(hex,amt)=>{const n=parseInt(hex.slice(1),16);let a=(n>>16&255),b=(n>>8&255),c=(n&255);a=Math.round(a+(255-a)*amt);b=Math.round(b+(255-b)*amt);c=Math.round(c+(255-c)*amt);return '#'+((1<<24)+(a<<16)+(b<<8)+c).toString(16).slice(1);};
  const single=sources.length===1;
  sources.forEach((s,idx)=>{const f=s.v/total;let a0=acc*2*Math.PI-Math.PI/2+(single?0:gap/2);acc+=f;let a1=acc*2*Math.PI-Math.PI/2-(single?0:gap/2);if(a1<a0)a1=a0;const lg=(a1-a0)>Math.PI?1:0;
   const p=(ang,rad)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];const[x0,y0]=p(a0,R),[x1,y1]=p(a1,R),[xi1,yi1]=p(a1,r),[xi0,yi0]=p(a0,r);
   defs+=`<linearGradient id="dg${idx}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(s.c,0.1)}"/><stop offset="1" stop-color="${shade(s.c,0.5)}"/></linearGradient>`;
   seg+=`<path d="M${x0} ${y0} A${R} ${R} 0 ${lg} 1 ${x1} ${y1} L${xi1} ${yi1} A${r} ${r} 0 ${lg} 0 ${xi0} ${yi0} Z" fill="url(#dg${idx})" class="don dslice" data-tip="${s.n}|${(s.v/total*100).toFixed(0)}|${nf(s.v*1000)}" style="--i:${idx};transform-origin:${cx}px ${cy}px" stroke="var(--panel)" stroke-width="2" stroke-linejoin="round"/>`;});
  const leg=sources.map(s=>`<span style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);font-weight:600"><i style="width:11px;height:11px;border-radius:4px;background:linear-gradient(135deg,${s.c},${shade(s.c,0.4)});display:inline-block;box-shadow:0 2px 6px ${s.c}55"></i>${s.n} <b class="mono" style="color:var(--ink)">${(s.v/total*100).toFixed(0)}%</b> <span class="mono" style="color:var(--ink-3);font-size:11px">$${nf(s.v*1000)}</span></span>`).join('');
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:16px"><svg width="220" height="220" viewBox="0 0 240 240" style="filter:drop-shadow(0 10px 24px rgba(59,91,255,.28))"><defs>${defs}<filter id="dglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g filter="url(#dglow)">${seg}</g><text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="12" fill="#98a0bb" font-family="'Inter','Noto Sans TC',sans-serif">NT$</text><text x="${cx}" y="${cy+22}" text-anchor="middle" font-size="30" font-weight="800" fill="#141a33" font-family="'Inter','Noto Sans TC',sans-serif">${totTxt}</text></svg><div style="display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;width:100%">${leg}</div></div>`;
}

/*
 * 共用函式庫 — 廣告分潤系統核心
 * 金額一律以「整數（新台幣元）」與「基點 bps」運算，避免浮點誤差。
 * 分潤比例 70% = 7000 bps；分潤金額 = round(revenue * bps / 10000)。
 */

/** 期間字串驗證 YYYY-MM */
function isPeriod(p) {
  return typeof p === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(p);
}

/** 期間 → 該月第一天（用於生效日比較），回傳可比較字串 YYYY-MM-01 */
function periodStart(p) {
  if (!isPeriod(p)) throw new AppError('INVALID_PERIOD', `期間格式錯誤：${p}`);
  return `${p}-01`;
}

/** 日期字串驗證 YYYY-MM-DD */
function isDate(d) {
  return typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d);
}

/** 分潤計算：整數金額 × 基點，四捨五入到整數元。永遠不產生浮點殘差。 */
function calcShare(revenue, rateBps) {
  if (!Number.isInteger(revenue)) throw new AppError('BAD_AMOUNT', `營收須為整數：${revenue}`);
  if (!Number.isInteger(rateBps) || rateBps < 0) throw new AppError('BAD_RATE', `比例基點須為非負整數：${rateBps}`);
  // 以整數運算後四捨五入（round half up）
  const scaled = revenue * rateBps;
  return Math.round(scaled / 10000);
}

/** 百分比字串 → 基點；接受 70 / 70.5 / "70" */
function pctToBps(pct) {
  const n = Number(pct);
  if (!Number.isFinite(n) || n < 0) throw new AppError('BAD_RATE', `分潤比例不合法：${pct}`);
  return Math.round(n * 100);
}
function bpsToPct(bps) { return bps / 100; }

/** 產生 CSV（欄位含逗號/引號/換行會自動加引號並跳脫） */
function toCSV(headers, rows) {
  const esc = (v) => {
    const s = v === null || v === undefined ? '' : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const head = headers.map((h) => esc(h.label !== undefined ? h.label : h)).join(',');
  const body = rows
    .map((r) => headers.map((h) => esc(r[h.key !== undefined ? h.key : h])).join(','))
    .join('\r\n');
  return '﻿' + head + '\r\n' + body; // 加 BOM，Excel 開啟中文不亂碼
}

/** 解析 CSV（支援引號、跳脫、CRLF/LF），回傳物件陣列（第一列為表頭） */
function parseCSV(text) {
  if (typeof text !== 'string') throw new AppError('BAD_CSV', 'CSV 內容須為字串');
  const clean = text.replace(/^﻿/, '');
  const rows = [];
  let row = [], field = '', i = 0, inQ = false;
  while (i < clean.length) {
    const c = clean[i];
    if (inQ) {
      if (c === '"') {
        if (clean[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { inQ = true; i++; continue; }
    if (c === ',') { row.push(field); field = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += c; i++;
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  if (rows.length === 0) return [];
  const headers = rows[0].map((h) => h.trim());
  return rows.slice(1)
    .filter((r) => r.some((v) => v !== '' && v !== undefined))
    .map((r) => {
      const o = {};
      headers.forEach((h, idx) => { o[h] = (r[idx] !== undefined ? r[idx] : '').trim(); });
      return o;
    });
}

/** 匯率換算：base 為系統基準幣別；rates 為 { CUR: 對 base 的匯率 } */
function fxConvert(amount, from, to, rates, base) {
  if (from === to) return amount;
  const rate = (cur) => {
    if (cur === base) return 1;
    const r = rates[cur];
    if (!r || r <= 0) throw new AppError('NO_FX', `缺少幣別匯率：${cur}`);
    return r;
  };
  // amount(from) → base → to
  const inBase = amount * rate(from);
  const out = inBase / rate(to);
  return Math.round(out);
}

/** 標準化錯誤（帶錯誤碼，供 API 對應 HTTP 狀態） */
class AppError extends Error {
  constructor(code, message, status) {
    super(message || code);
    this.code = code;
    this.status = status || AppError.STATUS[code] || 400;

}

/*

 * 結構與 supabase/schema.sql 的 Postgres 資料表一對一對應。

function createStore() {
  const store = {
    seq: {},
    roles: [], users: [], clients: [], media: [], placements: [],
    campaignTypes: [], shareRates: [], incomes: [], settlements: [],
    audit: [], notifications: [],
    settings: {
      baseCurrency: 'TWD',
      fxRates: { TWD: 1, USD: 31.5, JPY: 0.21 }, // 對 TWD 之匯率（示意，可後台設定）
      locale: 'zh',
      notify: { api_sync_failed: true, account_activation: true, settlement_done: true, password_reset: true },
    },
    nextId(table) {
      this.seq[table] = (this.seq[table] || 0) + 1;
      const prefix = { users: 'U', clients: 'C', media: 'M', placements: 'P', campaignTypes: 'T', shareRates: 'R', incomes: 'I', settlements: 'S', notifications: 'N', audit: 'A' }[table] || 'X';
      return `${prefix}${String(this.seq[table]).padStart(4, '0')}`;
    },
    toJSON() { return JSON.stringify(this, null, 2); },
  };
  return store;
}

function saveStore(store, path) { fs.writeFileSync(path, store.toJSON()); }
function loadStore(path) {
  const raw = JSON.parse(fs.readFileSync(path, 'utf8'));
  const s = createStore();
  Object.assign(s, raw);
  return s;
}

/*
 * 核心服務層。所有對外操作都需帶 actor（由 token 解出），並強制：
 *  - RBAC 角色權限
 *  - 資料範圍隔離（客戶帳號僅能存取自己 clientId）
 *  - 分潤比例版本化 + 生效日解析
 *  - 結算快照鎖定（已結算月份不因日後改比例而回溯變動）
 */

const LOCKED_STATUSES = ['issued', 'published', 'paid'];

function createService(store, opts = {}) {
  const SECRET = opts.secret || 'dev-secret-change-me';
  const clock = opts.clock || (() => new Date());
  const nowIso = () => clock().toISOString();
  const nowSec = () => Math.floor(clock().getTime() / 1000);

  // ---------- 內部小工具 ----------
  const roleById = (id) => store.roles.find((r) => r.id === id);
  const userByEmail = (e) => store.users.find((u) => u.email === String(e).toLowerCase());
  const clientById = (id) => store.clients.find((c) => c.id === id);
  const campaignByCode = (code) => store.campaignTypes.find((t) => t.code === code);
  const campaignById = (id) => store.campaignTypes.find((t) => t.id === id);

  function audit(actor, action, entity, entityId, detail) {
    store.audit.push({ id: store.nextId('audit'), at: nowIso(), actorId: actor ? actor.userId : null, action, entity, entityId, detail: detail || null });
  }
  function notify(type, to, payload) {
    if (store.settings.notify[type] === false) return null;
    const n = { id: store.nextId('notifications'), at: nowIso(), type, to: to || null, payload: payload || {}, read: false };
    store.notifications.push(n);
    return n;
  }

  // ---------- 認證 ----------
  function authenticate(email, password) {
    const u = userByEmail(email);
    if (!u || !auth.verifyPassword(password, u.passwordHash)) throw new AppError('BAD_CREDENTIALS', '帳號或密碼錯誤');
    if (!u.active) throw new AppError('FORBIDDEN', '帳號已停用');
    u.lastLogin = nowIso();
    const role = roleById(u.roleId);
    const token = auth.sign({ sub: u.id, role: role.code, roleId: u.roleId, clientId: u.clientId }, SECRET, 8 * 3600, nowSec());
    return { token, user: publicUser(u) };
  }
  function actorFromToken(token) {
    const body = auth.verify(token, SECRET, nowSec());
    const role = roleById(body.roleId);
    if (!role) throw new AppError('UNAUTHENTICATED', '角色不存在');
    return { userId: body.sub, roleCode: role.code, roleId: role.id, clientId: body.clientId || null, perms: role.perms.slice() };
  }
  function requireActor(actor) {
    if (!actor || !actor.userId) throw new AppError('UNAUTHENTICATED', '需要登入');
    return actor;
  }
  function require(actor, perm) {
    requireActor(actor);
    if (!actor.perms.includes(perm)) throw new AppError('FORBIDDEN', `角色權限不足：需要 ${perm}`);
    return actor;
  }
  function requireInternal(actor) {
    requireActor(actor);
    if (actor.clientId) throw new AppError('FORBIDDEN', '此操作僅限內部帳號');
    return actor;
  }
  /** 資料範圍隔離：客戶帳號強制綁定自己的 clientId */
  function scopeClient(actor, clientId) {
    requireActor(actor);
    if (actor.clientId) {
      if (clientId && clientId !== actor.clientId) throw new AppError('TENANT_DENIED', '權限隔離：僅能存取自己的資料');
      return actor.clientId;
    }
    if (!clientId) throw new AppError('NOT_FOUND', '缺少 clientId');
    if (!clientById(clientId)) throw new AppError('NOT_FOUND', `查無客戶：${clientId}`);
    return clientId;
  }
  function publicUser(u) {
    const role = roleById(u.roleId);
    return { id: u.id, email: u.email, name: u.name, role: role ? role.code : null, clientId: u.clientId, active: u.active, lastLogin: u.lastLogin };
  }

  // ---------- 分潤比例（版本化 + 生效日） ----------
  function setShareRate(actor, { clientId, pct, effectiveFrom, reason }) {
    require(actor, 'p_rate');
    if (!clientById(clientId)) throw new AppError('NOT_FOUND', `查無客戶：${clientId}`);
    if (!/^\d{4}-\d{2}-01$/.test(String(effectiveFrom))) throw new AppError('BAD_EFFECTIVE', '生效日須為每月 1 日（YYYY-MM-01）');
    const bps = pctToBps(pct);
    const ver = store.shareRates.filter((r) => r.clientId === clientId).reduce((m, r) => Math.max(m, r.version), 0) + 1;
    const rate = { id: store.nextId('shareRates'), clientId, rateBps: bps, effectiveFrom, reason: reason || '', createdBy: actor.userId, createdAt: nowIso(), version: ver };
    store.shareRates.push(rate);
    audit(actor, 'set_share_rate', 'shareRate', rate.id, { clientId, pct, effectiveFrom });
    // 注意：此處不觸碰任何既有 settlement；已結算月份為快照，永不回溯。
    return { ...rate, pct: bpsToPct(rate.rateBps) };
  }
  function resolveRate(clientId, period) {
    const start = periodStart(period);
    const cands = store.shareRates
      .filter((r) => r.clientId === clientId && r.effectiveFrom <= start)
      .sort((a, b) => (a.effectiveFrom === b.effectiveFrom ? a.version - b.version : (a.effectiveFrom < b.effectiveFrom ? -1 : 1)));
    if (cands.length === 0) throw new AppError('NO_RATE', '查無適用之分潤比例（請先設定生效比例）');
    const r = cands[cands.length - 1];
    return { rateBps: r.rateBps, rateId: r.id, version: r.version, pct: bpsToPct(r.rateBps) };
  }
  function listShareRates(actor, clientId) {
    const cid = scopeClient(actor, clientId);
    return store.shareRates.filter((r) => r.clientId === cid).map((r) => ({ ...r, pct: bpsToPct(r.rateBps) })).sort((a, b) => a.version - b.version);
  }

  // ---------- 客戶 / 媒體 / 版位 / 活動類型 設定 ----------
  function listCampaignTypes(actor) { requireActor(actor); return store.campaignTypes.filter((t) => t.active).map((t) => ({ ...t })); }
  function addCampaignType(actor, { code, name, fields }) {
    require(actor, 'p_acct');
    if (campaignByCode(code)) throw new AppError('CONFLICT', `活動類型代碼已存在：${code}`);
    const t = { id: store.nextId('campaignTypes'), code, name, active: true, fields: Array.isArray(fields) ? fields : [] };
    store.campaignTypes.push(t);
    audit(actor, 'add_campaign_type', 'campaignType', t.id, { code, name });
    return { ...t };
  }
  function addMedia(actor, { clientId, name }) {
    const cid = scopeClient(actor, clientId);
    let m = store.media.find((x) => x.clientId === cid && x.name === name);
    if (!m) { m = { id: store.nextId('media'), clientId: cid, name, active: true }; store.media.push(m); audit(actor, 'add_media', 'media', m.id, { name }); }
    return { ...m };
  }
  function addPlacement(actor, { clientId, mediaId, name }) {
    const cid = scopeClient(actor, clientId);
    const media = store.media.find((x) => x.id === mediaId && x.clientId === cid);
    if (!media) throw new AppError('NOT_FOUND', `查無媒體或不屬於此客戶：${mediaId}`);
    let p = store.placements.find((x) => x.clientId === cid && x.mediaId === mediaId && x.name === name);
    if (!p) { p = { id: store.nextId('placements'), clientId: cid, mediaId, name, active: true }; store.placements.push(p); audit(actor, 'add_placement', 'placement', p.id, { name }); }
    return { ...p };
  }
  function listClientConfig(actor, clientId) {
    const cid = scopeClient(actor, clientId);
    return {
      media: store.media.filter((m) => m.clientId === cid),
      placements: store.placements.filter((p) => p.clientId === cid),
      campaignTypes: store.campaignTypes.filter((t) => t.active),
    };
  }

  // ---------- 收入資料介接（人工上傳 + API 轉接） ----------
  function naturalKey(x) { return [x.clientId, x.period, x.mediaId || '', x.placementId || '', x.source, x.campaignTypeId].join('|'); }
  function upsertIncome(actor, rec) {
    const key = naturalKey(rec);
    const existing = store.incomes.find((i) => i.naturalKey === key);
    if (existing) {
      Object.assign(existing, rec, { naturalKey: key, updatedAt: nowIso() });
      return { action: 'updated', id: existing.id };
    }
    const row = { id: store.nextId('incomes'), naturalKey: key, createdAt: nowIso(), ...rec };
    store.incomes.push(row);
    return { action: 'inserted', id: row.id };
  }
  /** 將一列原始資料正規化成 income 記錄（media/placement 若不存在則自動建立於該客戶下） */
  function normalizeRow(actor, clientId, raw) {
    const period = String(raw.period || '').trim();
    if (!isPeriod(period)) throw new AppError('BAD_ROW', `期間格式錯誤：${raw.period}`);
    const revenue = Number(raw.revenue);
    if (!Number.isFinite(revenue) || revenue < 0) throw new AppError('BAD_ROW', `營收不合法：${raw.revenue}`);
    const typeCode = String(raw.campaignType || raw.campaign_type || 'revshare').trim();
    const type = campaignByCode(typeCode);
    if (!type) throw new AppError('BAD_ROW', `查無廣告活動類型：${typeCode}`);
    let mediaId = null, placementId = null;
    if (raw.media) mediaId = addMedia(actor, { clientId, name: String(raw.media).trim() }).id;
    if (raw.placement && mediaId) placementId = addPlacement(actor, { clientId, mediaId, name: String(raw.placement).trim() }).id;
    // 依活動類型設定挑出額外欄位放入 attributes（彈性欄位機制）
    const attributes = {};
    for (const f of type.fields) if (raw[f.key] !== undefined && raw[f.key] !== '') attributes[f.key] = raw[f.key];
    return {
      clientId, period, date: raw.date || null, mediaId, placementId,
      campaignTypeId: type.id, source: String(raw.source || 'manual').trim(),
      revenue: Math.round(revenue), currency: String(raw.currency || store.settings.baseCurrency).trim().toUpperCase(),
      impressions: raw.impressions !== undefined && raw.impressions !== '' ? Number(raw.impressions) : null,
      clicks: raw.clicks !== undefined && raw.clicks !== '' ? Number(raw.clicks) : null,
      attributes,
    };
  }
  function ingestManual(actor, { clientId, rows, csv }) {
    require(actor, 'p_acct');
    if (!clientById(clientId)) throw new AppError('NOT_FOUND', `查無客戶：${clientId}`);
    const list = csv ? parseCSV(csv) : (rows || []);
    const result = { inserted: 0, updated: 0, errors: [] };
    list.forEach((raw, idx) => {
      try {
        // 若該期間已結算鎖定，禁止再匯入影響（維持帳務一致）
        assertPeriodUnlocked(clientId, String(raw.period || '').trim());
        const rec = normalizeRow(actor, clientId, raw);
        const r = upsertIncome(actor, rec);
        result[r.action]++;
      } catch (e) { result.errors.push({ row: idx + 1, code: e.code || 'ERR', message: e.message }); }
    });
    audit(actor, 'ingest_manual', 'income', clientId, { count: list.length, ...result });
    return result;
  }
  /** API 轉接：fieldMap 將外部欄位名對應到本系統標準欄位；模擬同步失敗會發通知 */
  function ingestApi(actor, { clientId, source, records, fieldMap, fail }) {
    require(actor, 'p_acct');
    if (!clientById(clientId)) throw new AppError('NOT_FOUND', `查無客戶：${clientId}`);
    if (fail) {
      const n = notify('api_sync_failed', null, { source, clientId, message: fail });
      audit(actor, 'ingest_api_failed', 'income', clientId, { source, message: fail });
      return { ok: false, notified: !!n, error: fail };
    }
    const map = fieldMap || {};
    const applied = (records || []).map((r) => {
      const o = { source };
      for (const [dst, src] of Object.entries(map)) o[dst] = r[src];
      // 未在 map 的標準欄位若外部同名亦帶入
      for (const k of ['period', 'media', 'placement', 'revenue', 'currency', 'campaignType', 'impressions', 'clicks', 'date']) if (o[k] === undefined && r[k] !== undefined) o[k] = r[k];
      return o;
    });
    const res = ingestManual(actor, { clientId, rows: applied });
    audit(actor, 'ingest_api', 'income', clientId, { source, ...res });
    return { ok: true, ...res };
  }
  function listIncomes(actor, { clientId, period, campaignTypeCode } = {}) {
    const cid = scopeClient(actor, clientId);
    let rows = store.incomes.filter((i) => i.clientId === cid);
    if (period) rows = rows.filter((i) => i.period === period);
    if (campaignTypeCode) { const t = campaignByCode(campaignTypeCode); rows = rows.filter((i) => t && i.campaignTypeId === t.id); }
    return rows.map((i) => ({ ...i }));
  }

  // ---------- 結算 / 撥款（快照鎖定） ----------
  function findSettlement(clientId, period) { return store.settlements.find((s) => s.clientId === clientId && s.period === period); }
  function isLocked(s) { return s && LOCKED_STATUSES.includes(s.status); }
  function assertPeriodUnlocked(clientId, period) {
    const s = findSettlement(clientId, period);
    if (isLocked(s)) throw new AppError('LOCKED', `該期間 ${period} 已結算並鎖定，不可再變更來源資料`);
  }
  function buildLines(clientId, period) {
    const incomes = store.incomes.filter((i) => i.clientId === clientId && i.period === period);
    const { rateBps, rateId, version } = resolveRate(clientId, period);
    const base = store.settings.baseCurrency;
    let totalRevenue = 0, totalShare = 0;
    const lines = incomes.map((i) => {
      const revBase = fxConvert(i.revenue, i.currency, base, store.settings.fxRates, base);
      const share = calcShare(revBase, rateBps);
      totalRevenue += revBase; totalShare += share;
      return { incomeId: i.id, revenue: revBase, currency: base, rateBps, share, campaignTypeId: i.campaignTypeId };
    });
    return { lines, totalRevenue, totalShare, rateBps, rateId, rateVersion: version, base };
  }
  function generateSettlement(actor, { clientId, period }) {
    require(actor, 'p_pay');
    const cid = scopeClient(actor, clientId);
    if (!isPeriod(period)) throw new AppError('INVALID_PERIOD', `期間格式錯誤：${period}`);
    const existing = findSettlement(cid, period);
    if (existing) return { ...existing, reused: true }; // 已存在即鎖定快照，不重算、不重複
    const b = buildLines(cid, period);
    const s = {
      id: store.nextId('settlements'), clientId: cid, period, status: 'issued',
      lines: b.lines, totalRevenue: b.totalRevenue, totalShare: b.totalShare,
      rateBpsSnapshot: b.rateBps, rateVersionUsed: b.rateVersion, currency: b.base,
      snapshotVersion: 1, generatedAt: nowIso(), generatedBy: actor.userId,
      publishedAt: null, paidAt: null, payDate: null, note: null,
    };
    store.settlements.push(s);
    audit(actor, 'generate_settlement', 'settlement', s.id, { clientId: cid, period, totalShare: s.totalShare, rateBps: s.rateBpsSnapshot });
    return { ...s, reused: false };
  }
  function publishSettlement(actor, settlementId) {
    require(actor, 'p_pay');
    const s = store.settlements.find((x) => x.id === settlementId);
    if (!s) throw new AppError('NOT_FOUND', `查無結算單：${settlementId}`);
    if (s.status === 'issued') { s.status = 'published'; s.publishedAt = nowIso(); }
    notify('settlement_done', s.clientId, { settlementId: s.id, period: s.period, totalShare: s.totalShare });
    audit(actor, 'publish_settlement', 'settlement', s.id, { period: s.period });
    return { ...s };
  }
  function markPaid(actor, settlementId, payDate) {
    require(actor, 'p_pay');
    const s = store.settlements.find((x) => x.id === settlementId);
    if (!s) throw new AppError('NOT_FOUND', `查無結算單：${settlementId}`);
    s.status = 'paid'; s.paidAt = nowIso(); s.payDate = payDate || nowIso().slice(0, 10);
    audit(actor, 'mark_paid', 'settlement', s.id, { payDate: s.payDate });
    return { ...s };
  }
  /** 每月刷新：只為「有收入但尚未結算」的期間產生結算單，絕不動既有鎖定資料 */
  function refreshSettlements(actor, clientId) {
    require(actor, 'p_pay');
    const cid = scopeClient(actor, clientId);
    const periods = [...new Set(store.incomes.filter((i) => i.clientId === cid).map((i) => i.period))].sort();
    const created = [];
    for (const p of periods) if (!findSettlement(cid, p)) created.push(generateSettlement(actor, { clientId: cid, period: p }));
    return created;
  }
  /** 管理員手動重算（唯一會覆寫已結算快照的入口，需 p_rate + p_pay，且已撥款者需 force） */
  function recomputeSettlement(actor, settlementId, { force } = {}) {
    require(actor, 'p_pay'); require(actor, 'p_rate');
    const s = store.settlements.find((x) => x.id === settlementId);
    if (!s) throw new AppError('NOT_FOUND', `查無結算單：${settlementId}`);
    if (s.status === 'paid' && !force) throw new AppError('LOCKED', '已撥款之結算單需 force 才能重算');
    const prev = { totalRevenue: s.totalRevenue, totalShare: s.totalShare, rateBpsSnapshot: s.rateBpsSnapshot, snapshotVersion: s.snapshotVersion, lines: s.lines };
    const b = buildLines(s.clientId, s.period);
    s.lines = b.lines; s.totalRevenue = b.totalRevenue; s.totalShare = b.totalShare;
    s.rateBpsSnapshot = b.rateBps; s.rateVersionUsed = b.rateVersion; s.snapshotVersion++;
    audit(actor, 'recompute_settlement', 'settlement', s.id, { from: prev, to: { totalShare: s.totalShare, rateBps: s.rateBpsSnapshot }, force: !!force });
    return { ...s };
  }
  function listSettlements(actor, { clientId } = {}) {
    const cid = scopeClient(actor, clientId);
    return store.settlements.filter((s) => s.clientId === cid).map((s) => ({ ...s })).sort((a, b) => (a.period < b.period ? 1 : -1));
  }

  // ---------- 報表 / 匯出 / 趨勢 ----------
  /** 明細報表：依廣告活動類型決定顯示欄位（彈性欄位）；分潤金額以「已結算用快照、未結算用現行比例」呈現 */
  function report(actor, { clientId, period, campaignTypeCode } = {}) {
    require(actor, 'p_view');
    const cid = scopeClient(actor, clientId);
    const type = campaignTypeCode ? campaignByCode(campaignTypeCode) : null;
    const settlement = period ? findSettlement(cid, period) : null;
    const snapShare = new Map();
    if (settlement) for (const l of settlement.lines) snapShare.set(l.incomeId, l.share);

    let incomes = store.incomes.filter((i) => i.clientId === cid);
    if (period) incomes = incomes.filter((i) => i.period === period);
    if (type) incomes = incomes.filter((i) => i.campaignTypeId === type.id);

    const baseCols = [
      { key: 'period', label: '期間' }, { key: 'media', label: '媒體' }, { key: 'placement', label: '版位' },
      { key: 'campaignType', label: '廣告模式' }, { key: 'source', label: '來源' },
      { key: 'revenue', label: '營收' }, { key: 'ratePct', label: '比例' }, { key: 'share', label: '分潤金額' },
    ];
    // 彈性欄位：若指定了活動類型，附加該類型設定要顯示的欄位
    const dynCols = type ? type.fields.filter((f) => f.show).map((f) => ({ key: f.key, label: f.label })) : [];
    const columns = [...baseCols, ...dynCols];

    const rows = incomes.map((i) => {
      const t = campaignById(i.campaignTypeId);
      let share, ratePct;
      if (snapShare.has(i.id)) { share = snapShare.get(i.id); ratePct = bpsToPct(settlement.rateBpsSnapshot); }
      else { const rr = resolveRate(cid, i.period); share = calcShare(fxConvert(i.revenue, i.currency, store.settings.baseCurrency, store.settings.fxRates, store.settings.baseCurrency), rr.rateBps); ratePct = rr.pct; }
      const media = store.media.find((m) => m.id === i.mediaId);
      const placement = store.placements.find((p) => p.id === i.placementId);
      const base = {
        period: i.period, media: media ? media.name : '', placement: placement ? placement.name : '',
        campaignType: t ? t.name : '', source: i.source, revenue: i.revenue, ratePct, share,
        impressions: i.impressions, clicks: i.clicks,
      };
      for (const c of dynCols) base[c.key] = i.attributes[c.key] !== undefined ? i.attributes[c.key] : '';
      return base;
    });
    return { columns, rows, locked: isLocked(settlement) };
  }
  function exportReportCSV(actor, params) {
    require(actor, 'p_export');
    const { columns, rows } = report(actor, params);
    return toCSV(columns, rows);
  }
  /** 趨勢：近 n 個月營收/分潤（已結算用快照、未結算用現行比例） */
  function trend(actor, { clientId, months } = {}) {
    require(actor, 'p_view');
    const cid = scopeClient(actor, clientId);
    const all = [...new Set(store.incomes.filter((i) => i.clientId === cid).map((i) => i.period))].sort();
    const take = months ? all.slice(-months) : all;
    return take.map((p) => {
      const s = findSettlement(cid, p);
      if (isLocked(s)) return { period: p, revenue: s.totalRevenue, share: s.totalShare };
      const b = buildLines(cid, p);
      return { period: p, revenue: b.totalRevenue, share: b.totalShare };
    });
  }

  // ---------- 帳號 / 角色權限 ----------
  function listUsers(actor) { require(actor, 'p_acct'); return store.users.map(publicUser); }
  function createUser(actor, { email, name, roleCode, clientId, password }) {
    require(actor, 'p_acct');
    email = String(email).toLowerCase();
    if (userByEmail(email)) throw new AppError('CONFLICT', `Email 已存在：${email}`);
    const role = store.roles.find((r) => r.code === roleCode);
    if (!role) throw new AppError('NOT_FOUND', `查無角色：${roleCode}`);
    if (role.code === 'client' && !clientById(clientId)) throw new AppError('NOT_FOUND', '客戶帳號需綁定有效 clientId');
    const u = { id: store.nextId('users'), email, name, passwordHash: auth.hashPassword(password || Math.random().toString(36).slice(2)), roleId: role.id, clientId: role.code === 'client' ? clientId : null, active: true, createdAt: nowIso(), lastLogin: null };
    store.users.push(u);
    const setupToken = auth.sign({ sub: u.id, purpose: 'activate' }, SECRET, 72 * 3600, nowSec());
    notify('account_activation', u.clientId, { userId: u.id, email, setupToken });
    audit(actor, 'create_user', 'user', u.id, { email, roleCode });
    return { user: publicUser(u), setupToken };
  }
  function setUserActive(actor, userId, active) {
    require(actor, 'p_acct');
    const u = store.users.find((x) => x.id === userId);
    if (!u) throw new AppError('NOT_FOUND', `查無使用者：${userId}`);
    u.active = !!active; audit(actor, 'set_user_active', 'user', u.id, { active: u.active });
    return publicUser(u);
  }
  function updateRolePerms(actor, roleCode, perms) {
    require(actor, 'p_acct');
    const role = store.roles.find((r) => r.code === roleCode);
    if (!role) throw new AppError('NOT_FOUND', `查無角色：${roleCode}`);
    if (role.code === 'admin') throw new AppError('FORBIDDEN', '管理員角色權限不可移除');
    role.perms = perms.slice(); audit(actor, 'update_role_perms', 'role', role.id, { perms });
    return { code: role.code, perms: role.perms };
  }
  function requestPasswordReset(email) {
    const u = userByEmail(email);
    // 不論帳號是否存在都回一致結果（避免帳號列舉），但僅存在時發通知
    if (u) notify('password_reset', u.clientId, { userId: u.id, email: u.email, token: auth.sign({ sub: u.id, purpose: 'reset' }, SECRET, 3600, nowSec()) });
    return { ok: true };
  }

  // ---------- 設定 / 匯率 / 通知 ----------
  function listClients(actor) { requireInternal(actor); return store.clients.map((c) => ({ ...c })); }
  function getSettings(actor) { requireActor(actor); return { ...store.settings }; }
  function setLocale(actor, locale) { requireActor(actor); store.settings.locale = locale; return { locale }; }
  function setFxRate(actor, currency, rate) { require(actor, 'p_acct'); store.settings.fxRates[currency] = rate; audit(actor, 'set_fx', 'settings', currency, { rate }); return { ...store.settings.fxRates }; }
  function listNotifications(actor) { require(actor, 'p_acct'); return store.notifications.map((n) => ({ ...n })); }

  return {
    // auth
    authenticate, actorFromToken,
    // rate
    setShareRate, resolveRate, listShareRates,
    // config
    listCampaignTypes, addCampaignType, addMedia, addPlacement, listClientConfig,
    // ingest
    ingestManual, ingestApi, listIncomes,
    // settlement
    generateSettlement, publishSettlement, markPaid, refreshSettlements, recomputeSettlement, listSettlements, findSettlement,
    // report
    report, exportReportCSV, trend,
    // accounts
    listUsers, createUser, setUserActive, updateRolePerms, requestPasswordReset,
    // settings
    listClients, getSettings, setLocale, setFxRate, listNotifications,
    // helpers exposed for tests/ops
    _store: store,
  };
}


/*
 * HTTP API 層：將 service 方法對外為 REST 端點。
 * 認證以 Authorization: Bearer <token>；錯誤以 AppError.status 對應 HTTP 狀態碼。
 * 前端（Cloudflare Pages / 現有 Demo）以 fetch 呼叫本 API；正式環境等同 Supabase Edge Functions。
 */

function buildHandler(svc) {
  function actorOf(req) {
    const h = req.headers['authorization'] || '';
    const m = /^Bearer\s+(.+)$/.exec(h);
    if (!m) return null;
    return svc.actorFromToken(m[1]);
  }
  const routes = [];
  const add = (method, re, fn) => routes.push({ method, re, fn });

  // ---- 認證 ----
  add('POST', /^\/auth\/login$/, (req, res, body) => svc.authenticate(body.email, body.password));
  add('POST', /^\/auth\/forgot$/, (req, res, body) => svc.requestPasswordReset(body.email));

  // ---- 設定 / 我 ----
  add('GET', /^\/clients$/, (req) => svc.listClients(actorOf(req)));
  add('GET', /^\/settings$/, (req) => svc.getSettings(actorOf(req)));
  add('POST', /^\/settings\/locale$/, (req, r, b) => svc.setLocale(actorOf(req), b.locale));
  add('POST', /^\/settings\/fx$/, (req, r, b) => svc.setFxRate(actorOf(req), b.currency, b.rate));

  // ---- 設定資料 ----
  add('GET', /^\/config$/, (req, r, b, q) => svc.listClientConfig(actorOf(req), q.clientId));
  add('GET', /^\/campaign-types$/, (req) => svc.listCampaignTypes(actorOf(req)));
  add('POST', /^\/campaign-types$/, (req, r, b) => svc.addCampaignType(actorOf(req), b));
  add('POST', /^\/media$/, (req, r, b) => svc.addMedia(actorOf(req), b));
  add('POST', /^\/placements$/, (req, r, b) => svc.addPlacement(actorOf(req), b));

  // ---- 分潤比例 ----
  add('GET', /^\/rates$/, (req, r, b, q) => svc.listShareRates(actorOf(req), q.clientId));
  add('POST', /^\/rates$/, (req, r, b) => svc.setShareRate(actorOf(req), b));

  // ---- 收入介接 ----
  add('POST', /^\/ingest\/manual$/, (req, r, b) => svc.ingestManual(actorOf(req), b));
  add('POST', /^\/ingest\/api$/, (req, r, b) => svc.ingestApi(actorOf(req), b));
  add('GET', /^\/incomes$/, (req, r, b, q) => svc.listIncomes(actorOf(req), q));

  // ---- 報表 ----
  add('GET', /^\/report$/, (req, r, b, q) => svc.report(actorOf(req), q));
  add('GET', /^\/report\/export$/, (req, res, b, q) => {
    const csv = svc.exportReportCSV(actorOf(req), q);
    res.writeHead(200, { 'Content-Type': 'text/csv; charset=utf-8', 'Content-Disposition': 'attachment; filename="report.csv"' });
    res.end(csv); return undefined; // 已自行回應
  });
  add('GET', /^\/trend$/, (req, r, b, q) => svc.trend(actorOf(req), { clientId: q.clientId, months: q.months ? Number(q.months) : undefined }));

  // ---- 結算 / 撥款 ----
  add('GET', /^\/settlements$/, (req, r, b, q) => svc.listSettlements(actorOf(req), q));
  add('POST', /^\/settlements\/generate$/, (req, r, b) => svc.generateSettlement(actorOf(req), b));
  add('POST', /^\/settlements\/refresh$/, (req, r, b) => svc.refreshSettlements(actorOf(req), b.clientId));
  add('POST', /^\/settlements\/([^/]+)\/publish$/, (req, r, b, q, m) => svc.publishSettlement(actorOf(req), m[1]));
  add('POST', /^\/settlements\/([^/]+)\/pay$/, (req, r, b, q, m) => svc.markPaid(actorOf(req), m[1], b.payDate));
  add('POST', /^\/settlements\/([^/]+)\/recompute$/, (req, r, b, q, m) => svc.recomputeSettlement(actorOf(req), m[1], b));

  // ---- 帳號 / 角色 ----
  add('GET', /^\/users$/, (req) => svc.listUsers(actorOf(req)));
  add('POST', /^\/users$/, (req, r, b) => svc.createUser(actorOf(req), b));
  add('POST', /^\/users\/([^/]+)\/active$/, (req, r, b, q, m) => svc.setUserActive(actorOf(req), m[1], b.active));
  add('POST', /^\/roles\/([^/]+)\/perms$/, (req, r, b, q, m) => svc.updateRolePerms(actorOf(req), m[1], b.perms));
  add('GET', /^\/notifications$/, (req) => svc.listNotifications(actorOf(req)));

  const handler = (req, res) => {
    res.setHeader('Access-Control-Allow-Origin', '*');
    res.setHeader('Access-Control-Allow-Headers', 'authorization,content-type');
    res.setHeader('Access-Control-Allow-Methods', 'GET,POST,OPTIONS');
    if (req.method === 'OPTIONS') { res.writeHead(204); return res.end(); }
    const url = new URL(req.url, 'http://x');
    const q = Object.fromEntries(url.searchParams.entries());
    let raw = '';
    req.on('data', (c) => { raw += c; if (raw.length > 5e6) req.destroy(); });
    req.on('end', () => {
      let body = {};
      if (raw) { try { body = JSON.parse(raw); } catch { return send(res, 400, { error: { code: 'BAD_JSON', message: 'JSON 格式錯誤' } }); } }
      const route = routes.find((r) => r.method === req.method && r.re.test(url.pathname));
      if (!route) return send(res, 404, { error: { code: 'NOT_FOUND', message: '端點不存在' } });
      const m = url.pathname.match(route.re);
      try {
        const out = route.fn(req, res, body, q, m);
        if (out === undefined && res.writableEnded) return; // 端點已自行回應（如 CSV）
        send(res, 200, { data: out });
      } catch (e) {
        const status = e instanceof AppError ? e.status : 500;
        send(res, status, { error: { code: e.code || 'ERROR', message: e.message } });
      }
    });
  };
  return handler;
}

function send(res, status, obj) {
  const s = JSON.stringify(obj);
  res.writeHead(status, { 'Content-Type': 'application/json; charset=utf-8' });
  res.end(s);
}


// ---- 內建服務實例 + 示範資料 ----
const __store = createStore();
const __ids = seed(__store);
const __svc = createService(__store, { secret: 'demo' });
seedDemo(__svc, __ids);
const __handler = buildHandler(__svc);

// ---- 攔截 fetch('/api/..') 路由到內建 handler（其餘走原生 fetch）----
const __realFetch = window.fetch ? window.fetch.bind(window) : null;
window.fetch = function (url, opts = {}) {
  if (typeof url === 'string' && (url === '/api' || url.startsWith('/api/'))) {
    return new Promise((resolve) => {
      const u = url.slice(4) || '/';
      const headers = {}; for (const [k, v] of Object.entries(opts.headers || {})) headers[k.toLowerCase()] = v;
      const bodyStr = opts.body || '';
      const req = { url: u, method: opts.method || 'GET', headers,
        on(ev, cb) { if (ev === 'data') { if (bodyStr) cb(bodyStr); } else if (ev === 'end') { cb(); } }, destroy() {} };
      let status = 200, payload = '', hdrs = {}, ended = false;
      const res = { setHeader(k, v) { hdrs[k] = v; }, writeHead(s, h) { status = s; Object.assign(hdrs, h || {}); },
        end(p) { if (ended) return; ended = true; payload = p || ''; resolve(new Response(payload, { status, headers: hdrs })); },
        get writableEnded() { return ended; } };
      try { __handler(req, res); } catch (e) { resolve(new Response(JSON.stringify({ error: { code: e.code || 'ERR', message: e.message } }), { status: e.status || 500 })); }
    });
  }
  return __realFetch ? __realFetch(url, opts) : Promise.reject(new Error('fetch unavailable'));
};
